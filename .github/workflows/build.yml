# 编译与发布 CZL 单证 (Windows 安装包 + macOS 通用版)。
#
# 源码在私有仓库 woodchen-ink/czlexpress-tradedocs, 编译放在这个公开仓库里跑:
# 公开仓库的 Actions 不计分钟数, 而私有仓库的 Windows / macOS runner 按倍数计费。
#
# 三段: meta 解析版本 → build 按平台矩阵编译打包 → publish 合成 latest.json 并发 Release。
# 两个平台都成功才发布, 清单里不会出现只有一半平台的版本。
#
# 触发方式:
#   repository_dispatch (event_type: release)
#       由私有仓库的 Release 流程发来: 推 v* 标签时 publish=true, 编译并发布 Release,
#       latest.json 挂在最新 Release 上; 在私有仓库手动运行时 ref / publish 取它的输入,
#       不发布即试运行, 产物只挂在本次 Actions 里。日常不用来这个仓库操作。
#   workflow_dispatch
#       在本仓库直接手动运行, 参数同上 (备用)。
#
# 两种触发都只有对本仓库有写权限的人能发起; 不监听 push / pull_request,
# fork 发来的 PR 碰不到下面的 secret。
#
# 需要的 secret:
#   SOURCE_TOKEN  对 woodchen-ink/czlexpress-tradedocs 有 Contents 只读权限的 fine-grained PAT
# 发布用本仓库自带的 GITHUB_TOKEN, 不需要额外的写权限 token。

name: Build

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: "源码的标签或分支, 如 v0.4.0 或 main"
        required: true
        default: "main"
      publish:
        description: "发布为正式 Release (只对 v* 标签生效)"
        type: boolean
        default: false

permissions:
  contents: write

# 同一个 ref 不并发, 防止重复发布
concurrency:
  group: build-${{ github.event.client_payload.ref || inputs.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: woodchen-ink/czlexpress-tradedocs
  WAILS_VERSION: v2.12.0

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ver.outputs.ref }}
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 解析版本号
        id: ver
        env:
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_PUBLISH: ${{ github.event.client_payload.publish }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if ("${{ github.event_name }}" -eq "repository_dispatch") {
            $ref = $env:DISPATCH_REF
            # 旧的触发方没带 publish 字段, 视为发布 (只有推标签才会这样发)
            $publish = $env:DISPATCH_PUBLISH -ne "false"
          } else {
            $ref = $env:INPUT_REF
            $publish = $env:INPUT_PUBLISH -eq "true"
          }
          if (-not $ref) { throw "缺少源码 ref" }

          if ($ref -match '^v(\d+\.\d+\.\d+([-+].+)?)$') {
            $v = $Matches[1]
          } elseif ($publish) {
            throw "只有 v* 标签可以发布: $ref"
          } else {
            # 分支试运行: 版本号只用于产物命名
            $v = "0.0.0-dryrun"
          }
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "ref=$ref version=$v publish=$publish"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: windows
            runner: windows-latest
            platform: windows/amd64
          # 通用版 (Intel + Apple 芯片) 一个包
          - goos: darwin
            runner: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.meta.outputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          # 不把 token 留在 .git/config 里, 后续步骤用不到它
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/desktop/go.mod
          cache-dependency-path: src/desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/desktop/frontend/package-lock.json

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: 确保 NSIS 可用
        if: matrix.goos == 'windows'
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }

      - name: 写入版本号到 wails.json
        working-directory: src/desktop
        run: |
          # 只补版本等字段, 保留仓库里已有的 info (如 protocols: 登录回调协议靠它注册,
          # Windows 写进注册表, macOS 写进 Info.plist)
          $j = Get-Content wails.json -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $j.info) { $j | Add-Member -NotePropertyName info -NotePropertyValue ([pscustomobject]@{}) }
          $fields = [ordered]@{
            companyName    = "CZL Express"
            productName    = "CZL 单证"
            productVersion = $env:VERSION.Split('-')[0]
            copyright      = "Copyright © CZL Express"
            comments       = "CZL TradeDocs"
          }
          foreach ($k in $fields.Keys) {
            $j.info | Add-Member -NotePropertyName $k -NotePropertyValue $fields[$k] -Force
          }
          if (-not $j.info.protocols) { throw "wails.json 缺少 info.protocols, 登录回调将无法注册" }
          $j | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      # 只测 internal: main 包用 go:embed 嵌入 frontend/dist, 那是构建产物,
      # 此时还不存在, 而 main 包本身也没有测试
      - name: 测试
        working-directory: src/desktop
        run: go test ./internal/...

      # 产物用不带版本号的固定文件名: 官网与论坛直接链 releases/latest/download/<文件名>,
      # 永远指向最新版; 清单里的地址带 /download/v<版本>/, 仍指向确定的版本。
      - name: 编译 Windows 安装包
        if: matrix.goos == 'windows'
        working-directory: src/desktop
        run: |
          wails build -platform ${{ matrix.platform }} -nsis -trimpath `
            -ldflags "-s -w -X main.version=$env:VERSION"
          $src = Get-ChildItem build/bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $src) { throw "没有找到安装包" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item $src.FullName "dist/CZLTradeDocs-Setup.exe" -Force

      # macOS 产出两份: .dmg 给人下载 (拖进「应用程序」), .zip 给在线更新 (ditto 解包后原位替换)。
      # 没有 Apple 开发者证书, 只做 ad-hoc 签名: Apple 芯片要求至少有签名才能运行,
      # 首次打开需在「系统设置 → 隐私与安全性」点「仍要打开」; 在线更新下载的包不带隔离标记, 不再询问。
      - name: 编译 macOS 应用
        if: matrix.goos == 'darwin'
        working-directory: src/desktop
        run: |
          wails build -platform ${{ matrix.platform }} -trimpath `
            -ldflags "-s -w -X main.version=$env:VERSION"
          $src = Get-ChildItem build/bin -Filter "*.app" -Directory | Select-Object -First 1
          if (-not $src) { throw "没有找到 .app" }

          # Finder 里显示的是包名, 换成中文产品名; 包内可执行文件名不变
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          $app = "stage/CZL 单证.app"
          Move-Item $src.FullName $app
          codesign --force --deep --sign - $app
          if ($LASTEXITCODE) { throw "codesign 失败" }

          ditto -c -k --keepParent $app "dist/CZLTradeDocs-macos.zip"
          if ($LASTEXITCODE) { throw "zip 打包失败" }

          # -fs HFS+: 默认 APFS 时 hdiutil 估算镜像大小有误, 报「设备上无剩余空间」
          ln -s /Applications stage/Applications
          hdiutil create -volname "CZL 单证" -srcfolder stage -fs HFS+ -ov -format UDZO "dist/CZLTradeDocs-macos.dmg"
          if ($LASTEXITCODE) { throw "dmg 打包失败" }

      - name: 上传本平台产物
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.goos }}
          path: src/desktop/dist/*
          retention-days: 14

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: 拉取发布说明
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.meta.outputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: 生成 latest.json
        id: pkg
        working-directory: dist
        run: |
          $v = $env:VERSION
          $base = "https://github.com/${{ github.repository }}/releases/download/v$v"
          function Describe($name) {
            if (-not (Test-Path $name)) { throw "缺少产物 $name" }
            [ordered]@{
              url    = "$base/$name"
              sha256 = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
              size   = (Get-Item $name).Length
            }
          }
          $win = Describe "CZLTradeDocs-Setup.exe"
          $mac = Describe "CZLTradeDocs-macos.zip"
          # dmg 只给人下载, 不进清单
          if (-not (Test-Path "CZLTradeDocs-macos.dmg")) { throw "缺少 dmg" }

          $notesFile = "${{ github.workspace }}/src/docs/release-notes/$v.md"
          $notes = if (Test-Path $notesFile) { Get-Content $notesFile -Raw -Encoding utf8 } else { "" }

          # installer 是 Windows 包: 只认这个字段的旧版客户端靠它继续升级, 不能删
          $manifest = [ordered]@{
            version    = $v
            pubDate    = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes      = $notes.Trim()
            installer  = $win
            installers = [ordered]@{ windows = $win; darwin = $mac }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          "notes=$notesFile" >> $env:GITHUB_OUTPUT
          Get-ChildItem | ForEach-Object { Write-Host "$($_.Name)  $($_.Length) bytes" }

      - name: 上传合并产物 (试运行与正式发布都保留一份)
        uses: actions/upload-artifact@v7
        with:
          name: CZLTradeDocs-${{ env.VERSION }}
          path: dist/*
          retention-days: 14

      - name: 发布 Release
        if: needs.meta.outputs.publish == 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          $notesFile = "${{ steps.pkg.outputs.notes }}"
          $ghArgs = @("release", "create", "v$v", "--repo", "${{ github.repository }}", "--title", "CZL 单证 v$v")
          if (Test-Path $notesFile) { $ghArgs += @("--notes-file", $notesFile) } else { $ghArgs += @("--notes", "") }
          # latest.json 必须挂在「最新」Release 上: 客户端通过
          # releases/latest/download/latest.json 这个固定地址取清单
          $ghArgs += "--latest"
          $ghArgs += Get-ChildItem -File | ForEach-Object { $_.Name }
          gh @ghArgs
